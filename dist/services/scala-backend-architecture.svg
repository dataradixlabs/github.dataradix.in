<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090E"/>
      <stop offset="50%" stop-color="#0F111A"/>
      <stop offset="100%" stop-color="#05060A"/>
    </linearGradient>
    <linearGradient id="scala-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC322F"/>
      <stop offset="100%" stop-color="#E25552"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <pattern id="grid-pattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E2333" stroke-width="0.8" opacity="0.65"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-grad)"/>
  <rect width="1200" height="675" fill="url(#grid-pattern)"/>

  <!-- Radial Glow Behind Key Elements -->
  <circle cx="280" cy="330" r="280" fill="#DC322F" opacity="0.12"/>
  <circle cx="850" cy="320" r="320" fill="#06B6D4" opacity="0.09"/>

  <!-- Header Category & Brand Badge -->
  <rect x="70" y="60" width="180" height="30" rx="4" fill="#181B26" stroke="#2B3145" stroke-width="1"/>
  <circle cx="86" cy="75" r="4" fill="#DC322F"/>
  <text x="98" y="80" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">DATA RADIX CORE</text>

  <text x="70" y="130" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.8">Scala Backend Architecture</text>
  <text x="70" y="162" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Akka Cluster • Cats Effect 3 • ZIO 2 • Play Framework • Apache Kafka</text>

  <!-- Left Side: Interactive Topology / System Architecture Diagram -->
  <!-- 1. Client / Gateway Layer -->
  <g transform="translate(70, 210)">
    <rect width="180" height="380" rx="10" fill="#0C0F17" stroke="#23293D" stroke-width="1.5"/>
    <text x="24" y="36" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">INBOUND / APIS</text>
    
    <!-- Play Framework Node -->
    <g transform="translate(16, 60)">
      <rect width="148" height="64" rx="6" fill="#121624" stroke="#2D3748" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="64" rx="2" fill="#4ADE80"/>
      <text x="16" y="28" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Play Framework</text>
      <text x="16" y="48" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Non-blocking HTTP / REST</text>
    </g>

    <!-- gRPC Streaming Node -->
    <g transform="translate(16, 140)">
      <rect width="148" height="64" rx="6" fill="#121624" stroke="#2D3748" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="64" rx="2" fill="#38BDF8"/>
      <text x="16" y="28" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">gRPC &amp; Protobuf</text>
      <text x="16" y="48" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Sub-2ms RPC Streaming</text>
    </g>

    <!-- Http4s / Tapir Node -->
    <g transform="translate(16, 220)">
      <rect width="148" height="64" rx="6" fill="#121624" stroke="#2D3748" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="64" rx="2" fill="#F472B6"/>
      <text x="16" y="28" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Http4s &amp; Tapir</text>
      <text x="16" y="48" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Type-safe OpenAPI IO</text>
    </g>

    <!-- Security Gateway -->
    <g transform="translate(16, 300)">
      <rect width="148" height="56" rx="6" fill="#121624" stroke="#2D3748" stroke-width="1"/>
      <text x="16" y="26" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">mTLS &amp; JWT Engine</text>
      <text x="16" y="44" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Zero-Trust Boundaries</text>
    </g>
  </g>

  <!-- Flow Lines from Layer 1 to Layer 2 -->
  <path d="M 250 300 L 320 300" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="320,300 312,295 312,305" fill="#38BDF8"/>
  <path d="M 250 380 L 320 380" stroke="#DC322F" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="320,380 312,375 312,385" fill="#DC322F"/>

  <!-- 2. Core Execution Engine: Akka / Pekko & Pure FP -->
  <g transform="translate(320, 210)">
    <rect width="360" height="380" rx="10" fill="#0C0F17" stroke="#23293D" stroke-width="1.5"/>
    <text x="24" y="36" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">DISTRIBUTED CONCURRENCY &amp; RUNTIMES</text>
    
    <!-- Akka / Pekko Cluster Box -->
    <g transform="translate(20, 60)">
      <rect width="320" height="136" rx="8" fill="#131726" stroke="#DC322F" stroke-width="1.2"/>
      <rect x="0" y="0" width="320" height="28" rx="8" fill="#1F1A28"/>
      <circle cx="18" cy="14" r="5" fill="#DC322F"/>
      <text x="32" y="18" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Akka Toolkit &amp; Apache Pekko Cluster</text>
      
      <g transform="translate(16, 42)">
        <rect width="138" height="36" rx="4" fill="#090B12" stroke="#282F45" stroke-width="1"/>
        <text x="10" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Actor Systems</text>
      </g>
      <g transform="translate(166, 42)">
        <rect width="138" height="36" rx="4" fill="#090B12" stroke="#282F45" stroke-width="1"/>
        <text x="10" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Cluster Sharding</text>
      </g>
      <g transform="translate(16, 86)">
        <rect width="138" height="36" rx="4" fill="#090B12" stroke="#282F45" stroke-width="1"/>
        <text x="10" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Akka Streams</text>
      </g>
      <g transform="translate(166, 86)">
        <rect width="138" height="36" rx="4" fill="#090B12" stroke="#282F45" stroke-width="1"/>
        <text x="10" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Event Sourcing</text>
      </g>
    </g>

    <!-- Cats Effect 3 & ZIO 2 Functional Runtime Box -->
    <g transform="translate(20, 212)">
      <rect width="320" height="148" rx="8" fill="#131726" stroke="#38BDF8" stroke-width="1.2"/>
      <rect x="0" y="0" width="320" height="28" rx="8" fill="#162233"/>
      <circle cx="18" cy="14" r="5" fill="#38BDF8"/>
      <text x="32" y="18" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Typelevel Cats Effect 3 &amp; ZIO 2 Fibers</text>
      
      <text x="16" y="52" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Lightweight green-thread concurrency with zero JVM thread exhaustion.</text>
      
      <g transform="translate(16, 68)">
        <rect width="90" height="30" rx="4" fill="#090B12" stroke="#1E293B" stroke-width="1"/>
        <text x="14" y="20" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">FS2 Streams</text>
      </g>
      <g transform="translate(114, 68)">
        <rect width="90" height="30" rx="4" fill="#090B12" stroke="#1E293B" stroke-width="1"/>
        <text x="12" y="20" fill="#A855F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">ZIO STM</text>
      </g>
      <g transform="translate(212, 68)">
        <rect width="92" height="30" rx="4" fill="#090B12" stroke="#1E293B" stroke-width="1"/>
        <text x="16" y="20" fill="#4ADE80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Doobie SQL</text>
      </g>
      
      <rect x="16" y="108" width="288" height="26" rx="4" fill="#090B12"/>
      <text x="26" y="125" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Deterministic Cancellation • Fiber Supervision • Backpressure</text>
    </g>
  </g>

  <!-- Flow Lines from Layer 2 to Layer 3 -->
  <path d="M 680 340 L 750 340" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="750,340 742,335 742,345" fill="#F59E0B"/>

  <!-- 3. Event Bus & Storage Tier -->
  <g transform="translate(750, 210)">
    <rect width="380" height="380" rx="10" fill="#0C0F17" stroke="#23293D" stroke-width="1.5"/>
    <text x="24" y="36" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">EVENT FABRIC &amp; PERSISTENCE</text>
    
    <!-- Kafka Event Mesh -->
    <g transform="translate(20, 60)">
      <rect width="340" height="145" rx="8" fill="#131726" stroke="#F59E0B" stroke-width="1.2"/>
      <rect x="0" y="0" width="340" height="28" rx="8" fill="#241E15"/>
      <circle cx="18" cy="14" r="5" fill="#F59E0B"/>
      <text x="32" y="18" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Apache Kafka &amp; Event Mesh</text>
      
      <text x="16" y="52" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Exactly-Once Semantics (EOS) • Schema Registry (Avro/Protobuf)</text>
      
      <g transform="translate(16, 68)">
        <rect width="146" height="32" rx="4" fill="#090B12" stroke="#2B3145" stroke-width="1"/>
        <text x="10" y="21" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Alpakka Kafka Connect</text>
      </g>
      <g transform="translate(178, 68)">
        <rect width="146" height="32" rx="4" fill="#090B12" stroke="#2B3145" stroke-width="1"/>
        <text x="12" y="21" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">fs2-kafka Reactive IO</text>
      </g>
      
      <rect x="16" y="108" width="308" height="24" rx="4" fill="#090B12"/>
      <text x="24" y="124" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Ordered Partitioning • Consumer Group Auto-Rebalance</text>
    </g>

    <!-- Persistence & Operational Telemetry -->
    <g transform="translate(20, 222)">
      <rect width="340" height="138" rx="8" fill="#131726" stroke="#2D3748" stroke-width="1"/>
      <text x="16" y="28" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Storage &amp; Production Telemetry</text>
      
      <g transform="translate(16, 44)">
        <rect width="96" height="34" rx="4" fill="#090B12" stroke="#1E293B" stroke-width="1"/>
        <text x="12" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">PostgreSQL</text>
      </g>
      <g transform="translate(122, 44)">
        <rect width="96" height="34" rx="4" fill="#090B12" stroke="#1E293B" stroke-width="1"/>
        <text x="16" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Cassandra</text>
      </g>
      <g transform="translate(228, 44)">
        <rect width="96" height="34" rx="4" fill="#090B12" stroke="#1E293B" stroke-width="1"/>
        <text x="18" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Redis Cache</text>
      </g>
      
      <g transform="translate(16, 88)">
        <rect width="308" height="36" rx="4" fill="#090B12" stroke="#1E293B" stroke-width="1"/>
        <text x="14" y="23" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">OpenTelemetry • Prometheus • Kamon Metrics</text>
      </g>
    </g>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(70, 615)">
    <text x="0" y="22" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">BENCHMARK STANDARDS:</text>
    <text x="170" y="22" fill="#DC322F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">&lt; 2ms</text>
    <text x="210" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">p99 Latency</text>
    <text x="320" y="22" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">100k+ RPS</text>
    <text x="390" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Per Node Throughput</text>
    <text x="560" y="22" fill="#4ADE80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Zero Leak</text>
    <text x="635" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Resource Management</text>
    <text x="800" y="22" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">99.999%</text>
    <text x="865" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Cluster Reliability</text>
  </g>
</svg>
