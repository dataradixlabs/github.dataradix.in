<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="mob-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090E"/>
      <stop offset="50%" stop-color="#0D1420"/>
      <stop offset="100%" stop-color="#06070B"/>
    </linearGradient>
    <linearGradient id="cyan-mob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="emerald-mob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="mob-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1D2536" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#mob-bg)"/>
  <rect width="1200" height="675" fill="url(#mob-grid)"/>

  <!-- Radial Glows -->
  <circle cx="300" cy="320" r="280" fill="#06B6D4" opacity="0.10"/>
  <circle cx="860" cy="340" r="300" fill="#3B82F6" opacity="0.10"/>

  <!-- Header Category & Brand Badge -->
  <rect x="70" y="60" width="180" height="30" rx="4" fill="#121D2C" stroke="#233A57" stroke-width="1"/>
  <circle cx="86" cy="75" r="4" fill="#06B6D4"/>
  <text x="98" y="80" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">MOBILE PLATFORMS</text>

  <text x="70" y="130" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.8">Mobile App Architecture &amp; Cross-Platform Engineering</text>
  <text x="70" y="162" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Native iOS (Swift) • Native Android (Kotlin) • React Native • Offline-First Synchronization • Biometrics</text>

  <!-- 1. Native & Cross-Platform Engines -->
  <g transform="translate(70, 210)">
    <rect width="320" height="380" rx="10" fill="#0A0E17" stroke="#1E283C" stroke-width="1.5"/>
    <text x="24" y="36" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">01 / RUNTIMES &amp; COMPILATION</text>
    
    <g transform="translate(20, 60)">
      <rect width="280" height="90" rx="6" fill="#121927" stroke="#24334C" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="90" rx="2" fill="#38BDF8"/>
      <text x="16" y="26" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Native iOS &amp; Android Engines</text>
      <text x="16" y="48" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Swift 6 concurrency (Actors, Tasks) and Kotlin Coroutines/Flows with native bridge-free execution.</text>
    </g>

    <g transform="translate(20, 165)">
      <rect width="280" height="90" rx="6" fill="#121927" stroke="#24334C" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="90" rx="2" fill="#06B6D4"/>
      <text x="16" y="26" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Cross-Platform React Native &amp; Flutter</text>
      <text x="16" y="48" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Fabric renderer &amp; TurboModules with single-codebase deployment across App Store and Google Play.</text>
    </g>

    <g transform="translate(20, 270)">
      <rect width="280" height="85" rx="6" fill="#121927" stroke="#24334C" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="85" rx="2" fill="#10B981"/>
      <text x="16" y="26" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Hardware &amp; Biometric Security</text>
      <text x="16" y="48" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Secure Enclave, FaceID, Android Keystore, Bluetooth LE and sensor telemetry integration.</text>
    </g>
  </g>

  <!-- Flow Arrows -->
  <path d="M 390 400 L 440 400" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="440,400 432,395 432,405" fill="#06B6D4"/>

  <!-- 2. Mobile Device Mockup & Interactive Frame -->
  <g transform="translate(440, 210)">
    <rect width="400" height="380" rx="10" fill="#0A0E17" stroke="#1E283C" stroke-width="1.5"/>
    <text x="24" y="36" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">02 / INTERACTION &amp; OFFLINE ARCHITECTURE</text>
    
    <!-- Phone Mockup in Center -->
    <g transform="translate(110, 55)">
      <rect width="180" height="295" rx="24" fill="#0F1624" stroke="#2F425F" stroke-width="2"/>
      <rect x="50" y="8" width="80" height="14" rx="7" fill="#05080E"/>
      
      <!-- Phone screen content -->
      <rect x="12" y="32" width="156" height="248" rx="14" fill="#060911"/>
      <text x="24" y="55" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">DataRadix Pay</text>
      <circle cx="150" cy="52" r="6" fill="#10B981"/>

      <!-- Balance Card -->
      <g transform="translate(20, 68)">
        <rect width="140" height="60" rx="6" fill="#121C2B" stroke="#24344B" stroke-width="1"/>
        <text x="10" y="20" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Verified Ledger</text>
        <text x="10" y="44" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">$248,920.00</text>
      </g>

      <!-- Transaction List -->
      <g transform="translate(20, 138)">
        <rect width="140" height="32" rx="4" fill="#0D131F"/>
        <text x="10" y="20" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Instant gRPC Stream</text>
        <text x="105" y="20" fill="#10B981" font-family="monospace" font-size="9">&lt; 15ms</text>
      </g>
      <g transform="translate(20, 176)">
        <rect width="140" height="32" rx="4" fill="#0D131F"/>
        <text x="10" y="20" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Offline Sync Buffer</text>
        <text x="110" y="20" fill="#38BDF8" font-family="monospace" font-size="9">Active</text>
      </g>

      <!-- Bottom home indicator -->
      <rect x="55" y="268" width="70" height="3" rx="1.5" fill="#64748B"/>
    </g>
  </g>

  <!-- Flow Arrows -->
  <path d="M 840 400 L 890 400" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="890,400 882,395 882,405" fill="#3B82F6"/>

  <!-- 3. Offline Sync & CI/CD Telemetry -->
  <g transform="translate(890, 210)">
    <rect width="240" height="380" rx="10" fill="#0A0E17" stroke="#1E283C" stroke-width="1.5"/>
    <text x="20" y="36" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">03 / OFFLINE &amp; DEVOPS</text>
    
    <g transform="translate(16, 60)">
      <rect width="208" height="90" rx="6" fill="#121927" stroke="#24334C" stroke-width="1"/>
      <text x="14" y="24" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Crash-Free Rate</text>
      <text x="14" y="56" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">99.9%</text>
      <text x="14" y="74" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Real-time Sentry &amp; Datadog</text>
    </g>

    <g transform="translate(16, 160)">
      <rect width="208" height="90" rx="6" fill="#121927" stroke="#24334C" stroke-width="1"/>
      <text x="14" y="24" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">App Store Rating</text>
      <text x="14" y="56" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">4.8★</text>
      <text x="14" y="74" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Millions of Active Downloads</text>
    </g>

    <g transform="translate(16, 260)">
      <rect width="208" height="95" rx="6" fill="#121927" stroke="#24334C" stroke-width="1"/>
      <text x="14" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Offline SQLite &amp; WatermelonDB</text>
      <text x="14" y="44" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">CRDT (Conflict-free Replicated Data Types) for zero-data-loss mobile background sync.</text>
    </g>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(70, 615)">
    <text x="0" y="22" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">MOBILE STANDARDS:</text>
    <text x="160" y="22" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">99.9%</text>
    <text x="210" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Crash-Free Sessions</text>
    <text x="365" y="22" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">&lt; 15ms</text>
    <text x="425" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Local SQLite Query Latency</text>
    <text x="630" y="22" fill="#06B6D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">60 FPS</text>
    <text x="685" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Native Gesture Fluidity</text>
    <text x="860" y="22" fill="#A855F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Zero Loss</text>
    <text x="935" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Offline Reconciliation</text>
  </g>
</svg>
