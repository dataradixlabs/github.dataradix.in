<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="cs-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A10"/>
      <stop offset="50%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>
    <linearGradient id="cs-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="cs-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#cs-bg-grad)"/>
  <rect width="1200" height="675" fill="url(#cs-grid)"/>

  <!-- Ambient Light -->
  <circle cx="1050" cy="220" r="380" fill="#EC4899" opacity="0.14" filter="blur(90px)"/>

  <!-- Metric Card on Right -->
  <g transform="translate(780, 150)">
    <rect x="0" y="0" width="340" height="360" rx="16" fill="#0B1120" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="4" rx="2" fill="url(#cs-accent-grad)"/>
    
    <text x="32" y="55" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">MEASURABLE IMPACT</text>
    <text x="32" y="145" fill="#EC4899" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">60%</text>
    <text x="32" y="185" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">Faster Task Completion</text>

    <!-- Architecture Box Mock -->
    <rect x="32" y="225" width="276" height="95" rx="8" fill="#030712" stroke="#1F2937" stroke-width="1"/>
    <text x="48" y="255" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">TECH ARCHITECTURE</text>
    <text x="48" y="285" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">TypeScript • Next.js • TailwindCSS • Radix UI • Figma</text>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(100, 150)">
    <!-- Category &amp; Client Tag -->
    <rect x="0" y="0" width="280" height="36" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="18" r="5" fill="#EC4899"/>
    <text x="36" y="23" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">ENTERPRISE B2B SAAS</text>

    <!-- Project Title -->
    <text x="0" y="110" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
      SaaS Platform Experience Redesign
    </text>

    <!-- Client Subheading -->
    <text x="0" y="155" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">
      Client: ProductivityPro
    </text>

    <!-- Value Proposition -->
    <text x="0" y="215" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Linear-Style Accessible Design System Cutting Workflow ...
    </text>

    <!-- Divider Bar -->
    <rect x="0" y="260" width="80" height="4" rx="2" fill="url(#cs-accent-grad)"/>

    <!-- Brand Label -->
    <g transform="translate(0, 320)">
      <rect x="0" y="-6" width="28" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="8" r="5" fill="#10B981"/>
      <text x="40" y="14" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">DataRadix Case Study</text>
    </g>
  </g>
</svg>