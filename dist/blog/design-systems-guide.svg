<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg-grad-design-systems-guide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="50%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="accent-grad-design-systems-guide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <pattern id="grid-design-systems-guide" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-grad-design-systems-guide)"/>
  <rect width="1200" height="675" fill="url(#grid-design-systems-guide)"/>

  <!-- Ambient Radial Glows -->
  <circle cx="980" cy="240" r="380" fill="#EC4899" opacity="0.14" filter="blur(90px)"/>
  <circle cx="220" cy="520" r="300" fill="#F472B6" opacity="0.08" filter="blur(90px)"/>

  <!-- Tech Architectural Visual on Right -->
  <g transform="translate(870, 320)" opacity="0.9">
    
        <rect x="-130" y="-90" width="120" height="80" rx="6" fill="#161324" stroke="#EC4899" stroke-width="1.5"/>
        <rect x="10" y="-90" width="120" height="80" rx="6" fill="#161324" stroke="#F472B6" stroke-width="1.5"/>
        <rect x="-130" y="10" width="260" height="80" rx="6" fill="#161324" stroke="#475569" stroke-width="1.5"/>
        <circle cx="-70" cy="-50" r="15" fill="#EC4899"/>
        <circle cx="70" cy="-50" r="15" fill="#F472B6"/>
        <line x1="-100" y1="50" x2="100" y2="50" stroke="#EC4899" stroke-width="3" stroke-linecap="round"/>
      
  </g>

  <!-- Left Content Card -->
  <g transform="translate(90, 130)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="282" height="34" rx="4" fill="#131B2A" stroke="#2B3C55" stroke-width="1.2"/>
    <circle cx="16" cy="17" r="5" fill="#EC4899"/>
    <text x="32" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">EXPERIENCE ENGINEERING</text>

    <!-- Main Title Line 1 -->
    <text x="0" y="105" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
      Building Scalable Design Systems
    </text>

    <!-- Main Title Line 2 -->
    <text x="0" y="155" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
      Tokens, Components &amp; Code Connect
    </text>

    <!-- Concept Subtitle -->
    <text x="0" y="210" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Design Tokens, WCAG AAA Accessibility &amp; Multi-Platform Component Kits
    </text>

    <!-- Tech Tags Bar -->
    <g transform="translate(0, 250)">
      
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="125" height="28" rx="4" fill="#141C2B" stroke="#25354C" stroke-width="1"/>
          <text x="62" y="18" fill="#CBD5E1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Figma Tokens</text>
        </g>
      
        <g transform="translate(135, 0)">
          <rect x="0" y="0" width="125" height="28" rx="4" fill="#141C2B" stroke="#25354C" stroke-width="1"/>
          <text x="62" y="18" fill="#CBD5E1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Tailwind / Radix</text>
        </g>
      
        <g transform="translate(270, 0)">
          <rect x="0" y="0" width="125" height="28" rx="4" fill="#141C2B" stroke="#25354C" stroke-width="1"/>
          <text x="62" y="18" fill="#CBD5E1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">WCAG 2.2 AAA</text>
        </g>
      
        <g transform="translate(405, 0)">
          <rect x="0" y="0" width="125" height="28" rx="4" fill="#141C2B" stroke="#25354C" stroke-width="1"/>
          <text x="62" y="18" fill="#CBD5E1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Component Lib</text>
        </g>
      
    </g>

    <!-- Accent Divider Bar -->
    <rect x="0" y="300" width="80" height="4" rx="2" fill="url(#accent-grad-design-systems-guide)"/>

    <!-- Brand Footer Signature -->
    <g transform="translate(0, 350)">
      <rect x="0" y="-6" width="28" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="8" r="5" fill="#EC4899"/>
      <text x="40" y="14" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="0.5">DataRadix Engineering Insights</text>
    </g>
  </g>
</svg>