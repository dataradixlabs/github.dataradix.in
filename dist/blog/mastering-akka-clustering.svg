<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg-grad-mastering-akka-clustering" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="50%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="accent-grad-mastering-akka-clustering" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid-mastering-akka-clustering" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-grad-mastering-akka-clustering)"/>
  <rect width="1200" height="675" fill="url(#grid-mastering-akka-clustering)"/>

  <!-- Ambient Radial Glows -->
  <circle cx="980" cy="240" r="380" fill="#0284C7" opacity="0.14" filter="blur(90px)"/>
  <circle cx="220" cy="520" r="300" fill="#38BDF8" opacity="0.08" filter="blur(90px)"/>

  <!-- Tech Architectural Visual on Right -->
  <g transform="translate(870, 320)" opacity="0.9">
    
        <circle cx="0" cy="0" r="160" stroke="#1E293B" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
        <circle cx="0" cy="0" r="110" stroke="#0284C7" stroke-width="2" fill="none" opacity="0.4"/>
        <circle cx="0" cy="0" r="60" fill="#0F172A" stroke="#334155" stroke-width="2"/>
        <circle cx="0" cy="-110" r="10" fill="#0284C7"/>
        <circle cx="95" cy="55" r="8" fill="#38BDF8"/>
        <circle cx="-95" cy="55" r="8" fill="#10B981"/>
        <line x1="0" y1="-110" x2="95" y2="55" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
        <line x1="95" y1="55" x2="-95" y2="55" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
        <line x1="-95" y1="55" x2="0" y2="-110" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
        <rect x="-16" y="-16" width="32" height="32" rx="6" fill="#0284C7"/>
      
  </g>

  <!-- Left Content Card -->
  <g transform="translate(90, 130)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="249" height="34" rx="4" fill="#131B2A" stroke="#2B3C55" stroke-width="1.2"/>
    <circle cx="16" cy="17" r="5" fill="#0284C7"/>
    <text x="32" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">DISTRIBUTED SYSTEMS</text>

    <!-- Main Title Line 1 -->
    <text x="0" y="105" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
      Mastering Akka Clustering
    </text>

    <!-- Main Title Line 2 -->
    <text x="0" y="155" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
      Resilient Node Meshes at Scale
    </text>

    <!-- Concept Subtitle -->
    <text x="0" y="210" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Gossip Protocols, Dynamic Failure Detectors &amp; Split-Brain Resolvers
    </text>

    <!-- Tech Tags Bar -->
    <g transform="translate(0, 250)">
      
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="125" height="28" rx="4" fill="#141C2B" stroke="#25354C" stroke-width="1"/>
          <text x="62" y="18" fill="#CBD5E1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Akka Cluster</text>
        </g>
      
        <g transform="translate(135, 0)">
          <rect x="0" y="0" width="125" height="28" rx="4" fill="#141C2B" stroke="#25354C" stroke-width="1"/>
          <text x="62" y="18" fill="#CBD5E1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Apache Pekko</text>
        </g>
      
        <g transform="translate(270, 0)">
          <rect x="0" y="0" width="125" height="28" rx="4" fill="#141C2B" stroke="#25354C" stroke-width="1"/>
          <text x="62" y="18" fill="#CBD5E1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Actor Systems</text>
        </g>
      
        <g transform="translate(405, 0)">
          <rect x="0" y="0" width="125" height="28" rx="4" fill="#141C2B" stroke="#25354C" stroke-width="1"/>
          <text x="62" y="18" fill="#CBD5E1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Consensus</text>
        </g>
      
    </g>

    <!-- Accent Divider Bar -->
    <rect x="0" y="300" width="80" height="4" rx="2" fill="url(#accent-grad-mastering-akka-clustering)"/>

    <!-- Brand Footer Signature -->
    <g transform="translate(0, 350)">
      <rect x="0" y="-6" width="28" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="8" r="5" fill="#0284C7"/>
      <text x="40" y="14" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="0.5">DataRadix Engineering Insights</text>
    </g>
  </g>
</svg>