<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg-grad-scala-apache-spark-iceberg-lakehouse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="50%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="accent-grad-scala-apache-spark-iceberg-lakehouse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <pattern id="grid-scala-apache-spark-iceberg-lakehouse" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-grad-scala-apache-spark-iceberg-lakehouse)"/>
  <rect width="1200" height="675" fill="url(#grid-scala-apache-spark-iceberg-lakehouse)"/>

  <!-- Ambient Radial Glows -->
  <circle cx="980" cy="240" r="380" fill="#DC2626" opacity="0.14" filter="blur(90px)"/>
  <circle cx="220" cy="520" r="300" fill="#F97316" opacity="0.08" filter="blur(90px)"/>

  <!-- Tech Architectural Visual on Right -->
  <g transform="translate(870, 320)" opacity="0.9">
    
        <circle cx="0" cy="0" r="170" stroke="#1E293B" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
        <circle cx="0" cy="0" r="120" stroke="#DC2626" stroke-width="2" fill="none" opacity="0.4"/>
        <circle cx="0" cy="0" r="70" fill="#0F172A" stroke="#334155" stroke-width="2"/>
        <path d="M -110 -30 C -60 -60, -20 0, 40 -40 C 80 -60, 110 -20, 140 -30" stroke="#F97316" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
        <path d="M -130 10 C -80 -20, -30 40, 30 0 C 70 -20, 110 20, 130 10" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
        <path d="M -110 50 C -60 20, -20 70, 40 30 C 80 10, 110 50, 140 40" stroke="#DC2626" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
        <circle cx="0" cy="-120" r="9" fill="#DC2626"/>
        <circle cx="104" cy="60" r="7" fill="#F97316"/>
        <circle cx="-104" cy="60" r="7" fill="#06B6D4"/>
        <rect x="-18" y="-18" width="36" height="36" rx="8" fill="#DC2626"/>
      
  </g>

  <!-- Left Content Card -->
  <g transform="translate(90, 130)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="227" height="34" rx="4" fill="#131B2A" stroke="#2B3C55" stroke-width="1.2"/>
    <circle cx="16" cy="17" r="5" fill="#DC2626"/>
    <text x="32" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">DATA ARCHITECTURE</text>

    <!-- Main Title Line 1 -->
    <text x="0" y="105" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
      Building Real-Time Lakehouses
    </text>

    <!-- Main Title Line 2 -->
    <text x="0" y="155" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
      with Scala, Spark &amp; Iceberg
    </text>

    <!-- Concept Subtitle -->
    <text x="0" y="210" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      ACID Transactions, Streaming CDC Pipelines &amp; Zero-ETL Analytics
    </text>

    <!-- Tech Tags Bar -->
    <g transform="translate(0, 250)">
      
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="125" height="28" rx="4" fill="#141C2B" stroke="#25354C" stroke-width="1"/>
          <text x="62" y="18" fill="#CBD5E1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Scala 3</text>
        </g>
      
        <g transform="translate(135, 0)">
          <rect x="0" y="0" width="125" height="28" rx="4" fill="#141C2B" stroke="#25354C" stroke-width="1"/>
          <text x="62" y="18" fill="#CBD5E1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Apache Spark</text>
        </g>
      
        <g transform="translate(270, 0)">
          <rect x="0" y="0" width="125" height="28" rx="4" fill="#141C2B" stroke="#25354C" stroke-width="1"/>
          <text x="62" y="18" fill="#CBD5E1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Apache Iceberg</text>
        </g>
      
        <g transform="translate(405, 0)">
          <rect x="0" y="0" width="125" height="28" rx="4" fill="#141C2B" stroke="#25354C" stroke-width="1"/>
          <text x="62" y="18" fill="#CBD5E1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Delta Lake</text>
        </g>
      
    </g>

    <!-- Accent Divider Bar -->
    <rect x="0" y="300" width="80" height="4" rx="2" fill="url(#accent-grad-scala-apache-spark-iceberg-lakehouse)"/>

    <!-- Brand Footer Signature -->
    <g transform="translate(0, 350)">
      <rect x="0" y="-6" width="28" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="8" r="5" fill="#DC2626"/>
      <text x="40" y="14" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="0.5">DataRadix Engineering Insights</text>
    </g>
  </g>
</svg>