<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg-grad-akka-persistence-event-sourcing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="50%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="accent-grad-akka-persistence-event-sourcing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <pattern id="grid-akka-persistence-event-sourcing" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-grad-akka-persistence-event-sourcing)"/>
  <rect width="1200" height="675" fill="url(#grid-akka-persistence-event-sourcing)"/>

  <!-- Ambient Radial Glows -->
  <circle cx="980" cy="240" r="380" fill="#D97706" opacity="0.14" filter="blur(90px)"/>
  <circle cx="220" cy="520" r="300" fill="#FBBF24" opacity="0.08" filter="blur(90px)"/>

  <!-- Tech Architectural Visual on Right -->
  <g transform="translate(870, 320)" opacity="0.9">
    
        <rect x="-150" y="-80" width="300" height="160" rx="10" fill="#0D111A" stroke="#1E293B" stroke-width="1.5"/>
        <path d="M -130 0 L 130 0" stroke="#334155" stroke-width="2"/>
        <circle cx="-100" cy="0" r="14" fill="#0F172A" stroke="#D97706" stroke-width="2"/>
        <text x="-100" y="4" fill="#D97706" font-family="monospace" font-size="10" text-anchor="middle" font-weight="700">e1</text>
        <circle cx="-40" cy="0" r="14" fill="#0F172A" stroke="#FBBF24" stroke-width="2"/>
        <text x="-40" y="4" fill="#FBBF24" font-family="monospace" font-size="10" text-anchor="middle" font-weight="700">e2</text>
        <circle cx="20" cy="0" r="14" fill="#0F172A" stroke="#D97706" stroke-width="2"/>
        <text x="20" y="4" fill="#D97706" font-family="monospace" font-size="10" text-anchor="middle" font-weight="700">e3</text>
        <circle cx="80" cy="0" r="14" fill="#0F172A" stroke="#FBBF24" stroke-width="2"/>
        <text x="80" y="4" fill="#FBBF24" font-family="monospace" font-size="10" text-anchor="middle" font-weight="700">e4</text>
        <rect x="110" y="-12" width="24" height="24" rx="4" fill="#D97706"/>
      
  </g>

  <!-- Left Content Card -->
  <g transform="translate(90, 130)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="227" height="34" rx="4" fill="#131B2A" stroke="#2B3C55" stroke-width="1.2"/>
    <circle cx="16" cy="17" r="5" fill="#D97706"/>
    <text x="32" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">DATA ARCHITECTURE</text>

    <!-- Main Title Line 1 -->
    <text x="0" y="105" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
      Akka Persistence &amp; Event Sourcing
    </text>

    <!-- Main Title Line 2 -->
    <text x="0" y="155" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
      Immutable State Ledgers
    </text>

    <!-- Concept Subtitle -->
    <text x="0" y="210" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      CQRS Read/Write Separation, Journaling &amp; Snapshotting at Scale
    </text>

    <!-- Tech Tags Bar -->
    <g transform="translate(0, 250)">
      
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="125" height="28" rx="4" fill="#141C2B" stroke="#25354C" stroke-width="1"/>
          <text x="62" y="18" fill="#CBD5E1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Event Sourcing</text>
        </g>
      
        <g transform="translate(135, 0)">
          <rect x="0" y="0" width="125" height="28" rx="4" fill="#141C2B" stroke="#25354C" stroke-width="1"/>
          <text x="62" y="18" fill="#CBD5E1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">CQRS</text>
        </g>
      
        <g transform="translate(270, 0)">
          <rect x="0" y="0" width="125" height="28" rx="4" fill="#141C2B" stroke="#25354C" stroke-width="1"/>
          <text x="62" y="18" fill="#CBD5E1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Kafka Journal</text>
        </g>
      
        <g transform="translate(405, 0)">
          <rect x="0" y="0" width="125" height="28" rx="4" fill="#141C2B" stroke="#25354C" stroke-width="1"/>
          <text x="62" y="18" fill="#CBD5E1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Ledger Architecture</text>
        </g>
      
    </g>

    <!-- Accent Divider Bar -->
    <rect x="0" y="300" width="80" height="4" rx="2" fill="url(#accent-grad-akka-persistence-event-sourcing)"/>

    <!-- Brand Footer Signature -->
    <g transform="translate(0, 350)">
      <rect x="0" y="-6" width="28" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="8" r="5" fill="#D97706"/>
      <text x="40" y="14" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="0.5">DataRadix Engineering Insights</text>
    </g>
  </g>
</svg>