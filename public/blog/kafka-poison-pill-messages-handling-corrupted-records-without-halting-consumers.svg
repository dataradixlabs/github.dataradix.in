<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="0.7" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Accent Glow -->
  <circle cx="1050" cy="120" r="300" fill="#F59E0B" opacity="0.12" filter="blur(60px)" />
  <circle cx="150" cy="550" r="240" fill="#3B82F6" opacity="0.08" filter="blur(60px)" />

  <!-- Brand Header -->
  <g transform="translate(80, 80)">
    <rect width="44" height="44" rx="10" fill="url(#accentGrad)" />
    <path d="M 14 22 L 22 14 L 30 22 L 22 30 Z" fill="#FFFFFF" opacity="0.9" />
    <circle cx="22" cy="22" r="3.5" fill="#0B0F19" />
    <text x="60" y="30" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">DATARADIX<tspan fill="#F59E0B">.</tspan></text>
    <text x="235" y="30" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#9CA3AF" letter-spacing="1.5">ENGINEERING JOURNAL</text>
  </g>

  <!-- Category Badge -->
  <g transform="translate(80, 190)">
    <rect width="260" height="36" rx="18" fill="#1F2937" stroke="#F59E0B" stroke-width="1.2" opacity="0.9" />
    <circle cx="20" cy="18" r="5" fill="#F59E0B" />
    <text x="35" y="23" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#F3F4F6" letter-spacing="0.5">Kafka &amp; Streaming</text>
  </g>

  <!-- Title -->
  <g>
    <text x="80" y="330" font-family="Inter, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Kafka Poison Pill Messages:</text>
    <text x="80" y="376" font-family="Inter, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Handling Corrupted Records Without</text>
    <text x="80" y="422" font-family="Inter, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Halting Consumers</text>
  </g>

  <!-- Footer Metadata -->
  <g transform="translate(80, 520)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#374151" stroke-width="1" opacity="0.6" />
    
    <text x="0" y="42" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#E5E7EB">Author: Utkarsh</text>
    <text x="140" y="42" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#9CA3AF">• Software Development Engineer</text>
    
    <text x="1040" y="42" text-anchor="end" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#F59E0B">Kafka • Error Handling • DLQ</text>
  </g>
</svg>