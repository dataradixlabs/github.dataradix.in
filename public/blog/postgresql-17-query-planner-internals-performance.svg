<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg-grad-18" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="50%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="accent-grad-18" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid-18" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-grad-18)"/>
  <rect width="1200" height="675" fill="url(#grid-18)"/>

  <!-- Ambient Glow -->
  <circle cx="1020" cy="220" r="380" fill="#3B82F6" opacity="0.12" filter="blur(90px)"/>
  <circle cx="220" cy="520" r="300" fill="#0284C7" opacity="0.08" filter="blur(90px)"/>

  <!-- Tech Geometric Motif on Right -->
  <g transform="translate(860, 320)" opacity="0.88">
    <circle cx="0" cy="0" r="165" stroke="#1E293B" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
    <circle cx="0" cy="0" r="115" stroke="#3B82F6" stroke-width="2" fill="none" opacity="0.4"/>
    <circle cx="0" cy="0" r="65" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <!-- Orbiting Data Nodes -->
    <circle cx="0" cy="-115" r="8" fill="#3B82F6"/>
    <circle cx="100" cy="58" r="6" fill="#38BDF8"/>
    <circle cx="-100" cy="58" r="6" fill="#10B981"/>
    <!-- Radial Geometric Lines -->
    <line x1="-165" y1="0" x2="165" y2="0" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="0" y1="-165" x2="0" y2="165" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Data Radix Node Core -->
    <rect x="-18" y="-18" width="36" height="36" rx="8" fill="url(#accent-grad-18)"/>
  </g>

  <!-- Left Content Card -->
  <g transform="translate(100, 130)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="300" height="34" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="17" r="5" fill="#3B82F6"/>
    <text x="32" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">DATA ARCHITECTURE</text>

    <!-- Main Title Line 1 -->
    <text x="0" y="105" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
      PostgreSQL 17 Deep Dive: Execution Plans,
    </text>

    <!-- Main Title Line 2 -->
    <text x="0" y="155" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
      JIT Compilation, and B-Tree Scans
    </text>

    <!-- Concept Subtitle -->
    <text x="0" y="210" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      EXPLAIN ANALYZE Buffers, Memory Sorts &amp; Partition Pruning
    </text>

    <!-- Tech Tags Bar -->
    <g transform="translate(0, 250)">
      
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="120" height="26" rx="13" fill="#1E293B" opacity="0.8"/>
          <text x="60" y="17" fill="#CBD5E1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">PostgreSQL</text>
        </g>
      
        <g transform="translate(130, 0)">
          <rect x="0" y="0" width="120" height="26" rx="13" fill="#1E293B" opacity="0.8"/>
          <text x="60" y="17" fill="#CBD5E1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Database Optimization</text>
        </g>
      
        <g transform="translate(260, 0)">
          <rect x="0" y="0" width="120" height="26" rx="13" fill="#1E293B" opacity="0.8"/>
          <text x="60" y="17" fill="#CBD5E1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">SQL Performance</text>
        </g>
      
    </g>

    <!-- Divider Bar -->
    <rect x="0" y="300" width="80" height="4" rx="2" fill="url(#accent-grad-18)"/>

    <!-- Brand Footer Signature -->
    <g transform="translate(0, 350)">
      <rect x="0" y="-6" width="28" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="8" r="5" fill="#38BDF8"/>
      <text x="40" y="14" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">DataRadix Engineering Insights</text>
    </g>
  </g>
</svg>