<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="50%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-grad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Ambient Glow -->
  <circle cx="1000" cy="220" r="380" fill="#DC2626" opacity="0.12" filter="blur(90px)"/>
  <circle cx="250" cy="520" r="320" fill="#0284C7" opacity="0.09" filter="blur(90px)"/>

  <!-- Tech Geometric Pipeline Visual on Right -->
  <g transform="translate(850, 320)" opacity="0.9">
    <!-- Outer Orbit &amp; Grid -->
    <circle cx="0" cy="0" r="170" stroke="#1E293B" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
    <circle cx="0" cy="0" r="120" stroke="#DC2626" stroke-width="2" fill="none" opacity="0.4"/>
    <circle cx="0" cy="0" r="70" fill="#0F172A" stroke="#334155" stroke-width="2"/>

    <!-- Stream Waves / Data Lakehouse Layers -->
    <path d="M -110 -30 C -60 -60, -20 0, 40 -40 C 80 -60, 110 -20, 140 -30" stroke="#F97316" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M -130 10 C -80 -20, -30 40, 30 0 C 70 -20, 110 20, 130 10" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M -110 50 C -60 20, -20 70, 40 30 C 80 10, 110 50, 140 40" stroke="#DC2626" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Orbiting Lakehouse Storage Nodes -->
    <circle cx="0" cy="-120" r="9" fill="#DC2626"/>
    <circle cx="104" cy="60" r="7" fill="#F97316"/>
    <circle cx="-104" cy="60" r="7" fill="#06B6D4"/>
    
    <!-- Central Scala + Streaming Spark Core -->
    <rect x="-18" y="-18" width="36" height="36" rx="8" fill="url(#accent-grad)"/>
  </g>

  <!-- Left Content Card -->
  <g transform="translate(100, 130)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="330" height="34" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="17" r="5" fill="#DC2626"/>
    <text x="32" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">DATA &amp; STREAMING ARCHITECTURE</text>

    <!-- Main Title -->
    <text x="0" y="105" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
      Building Real-Time Lakehouses
    </text>

    <!-- Title Line 2 -->
    <text x="0" y="155" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
      with Scala, Spark &amp; Iceberg
    </text>

    <!-- Subtitle / Concept -->
    <text x="0" y="210" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      ACID Transactions, Streaming CDC Pipelines &amp; Zero-ETL Analytics
    </text>

    <!-- Divider Bar -->
    <rect x="0" y="255" width="80" height="4" rx="2" fill="url(#accent-grad)"/>

    <!-- Brand Footer Signature -->
    <g transform="translate(0, 320)">
      <rect x="0" y="-6" width="28" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="8" r="5" fill="#F97316"/>
      <text x="40" y="14" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">DataRadix Engineering Insights</text>
    </g>
  </g>
</svg>