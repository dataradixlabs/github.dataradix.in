<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-grad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Ambient Glow -->
  <circle cx="1000" cy="200" r="350" fill="#06B6D4" opacity="0.12" filter="blur(80px)"/>
  <circle cx="200" cy="550" r="300" fill="#0284C7" opacity="0.08" filter="blur(90px)"/>

  <!-- Tech Geometric Motif on Right -->
  <g transform="translate(850, 320)" opacity="0.85">
    <circle cx="0" cy="0" r="160" stroke="#1E293B" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
    <circle cx="0" cy="0" r="110" stroke="#06B6D4" stroke-width="2" fill="none" opacity="0.4"/>
    <circle cx="0" cy="0" r="60" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <!-- Orbiting nodes -->
    <circle cx="0" cy="-110" r="8" fill="#06B6D4"/>
    <circle cx="95" cy="55" r="6" fill="#38BDF8"/>
    <circle cx="-95" cy="55" r="6" fill="#10B981"/>
    <!-- Radial Lines -->
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="0" y1="-160" x2="0" y2="160" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Data Radix Node Core -->
    <rect x="-16" y="-16" width="32" height="32" rx="6" fill="url(#accent-grad)"/>
  </g>

  <!-- Left Content Card -->
  <g transform="translate(100, 140)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="240" height="34" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="17" r="5" fill="#06B6D4"/>
    <text x="32" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">DISTRIBUTED SYSTEMS</text>

    <!-- Main Title -->
    <text x="0" y="110" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
      Mastering Akka Clustering
    </text>

    <!-- Subtitle / Concept -->
    <text x="0" y="165" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
      Resilient Node Meshes, Gossip Protocols & Split-Brain Resolvers
    </text>

    <!-- Divider Bar -->
    <rect x="0" y="220" width="80" height="4" rx="2" fill="url(#accent-grad)"/>

    <!-- Brand Footer Signature -->
    <g transform="translate(0, 310)">
      <rect x="0" y="-6" width="28" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="8" r="5" fill="#38BDF8"/>
      <text x="40" y="14" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">DataRadix Engineering Insights</text>
    </g>
  </g>
</svg>