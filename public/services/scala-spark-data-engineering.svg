<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="spark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090E"/>
      <stop offset="50%" stop-color="#12101E"/>
      <stop offset="100%" stop-color="#06070B"/>
    </linearGradient>
    <linearGradient id="spark-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E25A1C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="lakehouse-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="scala-red2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC322F"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <pattern id="grid-spark" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#221C30" stroke-width="0.8" opacity="0.65"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#spark-bg)"/>
  <rect width="1200" height="675" fill="url(#grid-spark)"/>

  <!-- Radial Glows -->
  <circle cx="300" cy="320" r="300" fill="#E25A1C" opacity="0.12"/>
  <circle cx="880" cy="340" r="320" fill="#0284C7" opacity="0.10"/>

  <!-- Header Category & Brand Badge -->
  <rect x="70" y="60" width="195" height="30" rx="4" fill="#1C1424" stroke="#3A284C" stroke-width="1"/>
  <circle cx="86" cy="75" r="4" fill="#E25A1C"/>
  <text x="98" y="80" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">DATA RADIX PIPELINES</text>

  <text x="70" y="130" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.8">Scala &amp; Apache Spark Lakehouse Pipeline</text>
  <text x="70" y="162" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Petabyte-Scale Spark • Apache Flink • Delta Lake • Apache Iceberg • Real-Time Streaming</text>

  <!-- 1. INGESTION & EVENT STREAMING -->
  <g transform="translate(70, 210)">
    <rect width="210" height="380" rx="10" fill="#0C0E17" stroke="#242B3F" stroke-width="1.5"/>
    <text x="20" y="36" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">REAL-TIME INGESTION</text>
    
    <!-- Kafka Event Stream Box -->
    <g transform="translate(16, 60)">
      <rect width="178" height="88" rx="6" fill="#131726" stroke="#E25A1C" stroke-width="1.2"/>
      <rect x="0" y="0" width="178" height="26" rx="6" fill="#22181F"/>
      <circle cx="16" cy="13" r="4" fill="#E25A1C"/>
      <text x="28" y="17" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Apache Kafka &amp; Redpanda</text>
      
      <text x="14" y="48" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Millions of events / sec</text>
      <text x="14" y="66" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Partitioned by Key • Zero-Copy</text>
    </g>

    <!-- Change Data Capture (CDC) -->
    <g transform="translate(16, 164)">
      <rect width="178" height="88" rx="6" fill="#131726" stroke="#2D3748" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="88" rx="2" fill="#38BDF8"/>
      <text x="16" y="28" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Debezium CDC</text>
      <text x="16" y="48" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">OLTP Log Replication</text>
      <text x="16" y="68" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Postgres / MySQL / Oracle</text>
    </g>

    <!-- Batch Object Ingest -->
    <g transform="translate(16, 268)">
      <rect width="178" height="88" rx="6" fill="#131726" stroke="#2D3748" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="88" rx="2" fill="#FBBF24"/>
      <text x="16" y="28" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Multi-Cloud Ingress</text>
      <text x="16" y="48" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">S3 / GCS / Azure ADLS</text>
      <text x="16" y="68" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Parquet, ORC, AVRO, JSON</text>
    </g>
  </g>

  <!-- Flow Lines to Processing Tier -->
  <path d="M 280 300 L 340 300" stroke="#E25A1C" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="340,300 332,295 332,305" fill="#E25A1C"/>
  <path d="M 280 400 L 340 400" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="340,400 332,395 332,405" fill="#38BDF8"/>

  <!-- 2. SCALA COMPUTATION TIER: SPARK & FLINK -->
  <g transform="translate(340, 210)">
    <rect width="450" height="380" rx="10" fill="#0C0E17" stroke="#242B3F" stroke-width="1.5"/>
    <text x="24" y="36" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">DISTRIBUTED SCALA COMPUTATION ENGINE</text>
    
    <!-- Spark Engine Deep Dive -->
    <g transform="translate(20, 60)">
      <rect width="410" height="180" rx="8" fill="#141124" stroke="#E25A1C" stroke-width="1.3"/>
      <rect x="0" y="0" width="410" height="30" rx="8" fill="#24141E"/>
      <circle cx="18" cy="15" r="5" fill="#E25A1C"/>
      <text x="32" y="20" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Apache Spark 3.x / 4.x in Scala</text>
      
      <g transform="translate(16, 44)">
        <rect width="180" height="52" rx="4" fill="#090812" stroke="#2B213A" stroke-width="1"/>
        <text x="12" y="22" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Catalyst Optimizer</text>
        <text x="12" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Whole-stage code generation &amp; CBO</text>
      </g>
      <g transform="translate(208, 44)">
        <rect width="186" height="52" rx="4" fill="#090812" stroke="#2B213A" stroke-width="1"/>
        <text x="12" y="22" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Adaptive Query Execution</text>
        <text x="12" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Dynamic coalescing &amp; skew joins</text>
      </g>

      <g transform="translate(16, 108)">
        <rect width="378" height="56" rx="4" fill="#090812" stroke="#2B213A" stroke-width="1"/>
        <text x="14" y="22" fill="#F97316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Scala Type-Safe Dataset APIs &amp; Low-Allocation UDFs</text>
        <text x="14" y="42" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Custom Salting • Broadcast Hash Joins • Spill-to-Disk Elimination</text>
      </g>
    </g>

    <!-- Flink Stateful Stream Processing -->
    <g transform="translate(20, 254)">
      <rect width="410" height="106" rx="8" fill="#131626" stroke="#38BDF8" stroke-width="1"/>
      <rect x="0" y="0" width="410" height="28" rx="8" fill="#162233"/>
      <circle cx="18" cy="14" r="5" fill="#38BDF8"/>
      <text x="32" y="18" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Apache Flink Real-Time Stateful Processing</text>
      
      <g transform="translate(16, 40)">
        <rect width="180" height="48" rx="4" fill="#090B12" stroke="#1E293B" stroke-width="1"/>
        <text x="12" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">RocksDB State Store</text>
        <text x="12" y="36" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Incremental Checkpointing</text>
      </g>
      <g transform="translate(208, 40)">
        <rect width="186" height="48" rx="4" fill="#090B12" stroke="#1E293B" stroke-width="1"/>
        <text x="12" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Event-Time Watermarks</text>
        <text x="12" y="36" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Sliding &amp; Session Windows</text>
      </g>
    </g>
  </g>

  <!-- Flow Lines to Lakehouse Storage -->
  <path d="M 790 350 L 840 350" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="840,350 832,345 832,355" fill="#38BDF8"/>

  <!-- 3. OPEN LAKEHOUSE & ANALYTICS TIER -->
  <g transform="translate(840, 210)">
    <rect width="290" height="380" rx="10" fill="#0C0E17" stroke="#242B3F" stroke-width="1.5"/>
    <text x="20" y="36" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">OPEN LAKEHOUSE &amp; ANALYTICS</text>
    
    <!-- Delta Lake & Apache Iceberg -->
    <g transform="translate(16, 60)">
      <rect width="258" height="130" rx="8" fill="#101A2B" stroke="#38BDF8" stroke-width="1.2"/>
      <rect x="0" y="0" width="258" height="26" rx="8" fill="#14263D"/>
      <text x="14" y="17" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Delta Lake &amp; Apache Iceberg</text>
      
      <g transform="translate(12, 38)">
        <rect width="112" height="36" rx="4" fill="#070E1A" stroke="#1E3A5F" stroke-width="1"/>
        <text x="10" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">ACID Transactions</text>
      </g>
      <g transform="translate(132, 38)">
        <rect width="114" height="36" rx="4" fill="#070E1A" stroke="#1E3A5F" stroke-width="1"/>
        <text x="10" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Time Travel Replay</text>
      </g>
      <g transform="translate(12, 82)">
        <rect width="234" height="36" rx="4" fill="#070E1A" stroke="#1E3A5F" stroke-width="1"/>
        <text x="14" y="22" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Z-Ordering &amp; Partition Compaction</text>
      </g>
    </g>

    <!-- Query Engines & Consumers -->
    <g transform="translate(16, 206)">
      <rect width="258" height="154" rx="8" fill="#131726" stroke="#2D3748" stroke-width="1"/>
      <text x="14" y="26" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Downstream Serving &amp; AI</text>
      
      <g transform="translate(12, 42)">
        <rect width="112" height="42" rx="4" fill="#090B12" stroke="#1E293B" stroke-width="1"/>
        <text x="10" y="20" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Trino / Presto</text>
        <text x="10" y="34" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Sub-second SQL</text>
      </g>
      <g transform="translate(132, 42)">
        <rect width="114" height="42" rx="4" fill="#090B12" stroke="#1E293B" stroke-width="1"/>
        <text x="10" y="20" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">ClickHouse</text>
        <text x="10" y="34" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Real-time OLAP</text>
      </g>

      <g transform="translate(12, 94)">
        <rect width="234" height="46" rx="4" fill="#090B12" stroke="#1E293B" stroke-width="1"/>
        <text x="14" y="20" fill="#4ADE80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Feature Stores &amp; Model Training</text>
        <text x="14" y="36" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Deterministic reproducibility</text>
      </g>
    </g>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(70, 615)">
    <text x="0" y="22" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">PROVEN SCALE:</text>
    <text x="130" y="22" fill="#E25A1C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">64%</text>
    <text x="165" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Cloud Compute Reduction</text>
    <text x="360" y="22" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Petabytes</text>
    <text x="435" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Daily Data Processed</text>
    <text x="600" y="22" fill="#4ADE80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Zero OOM</text>
    <text x="675" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Memory Optimization</text>
    <text x="830" y="22" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Sub-Second</text>
    <text x="915" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Stream Ingestion SLA</text>
  </g>
</svg>
