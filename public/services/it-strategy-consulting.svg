<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="consulting-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E"/>
      <stop offset="50%" stop-color="#0E1624"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>
    <linearGradient id="emerald-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="blue-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <pattern id="consulting-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E2B3E" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#consulting-bg)"/>
  <rect width="1200" height="675" fill="url(#consulting-grid)"/>

  <!-- Radial Glows -->
  <circle cx="280" cy="320" r="300" fill="#10B981" opacity="0.10"/>
  <circle cx="880" cy="340" r="320" fill="#3B82F6" opacity="0.10"/>

  <!-- Header Category & Brand Badge -->
  <rect x="70" y="60" width="195" height="30" rx="4" fill="#111F2E" stroke="#22425E" stroke-width="1"/>
  <circle cx="86" cy="75" r="4" fill="#10B981"/>
  <text x="98" y="80" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">ENTERPRISE ADVISORY</text>

  <text x="70" y="130" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.8">IT Consulting &amp; Technology Strategy Roadmap</text>
  <text x="70" y="162" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Architectural Due Diligence • Cloud FinOps Optimization • CTO-as-a-Service • Target Operating Models</text>

  <!-- 1. Technical Due Diligence & Audit Framework -->
  <g transform="translate(70, 210)">
    <rect width="320" height="380" rx="10" fill="#0A0E17" stroke="#1D2A3D" stroke-width="1.5"/>
    <text x="24" y="36" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">01 / ARCHITECTURE AUDIT</text>
    
    <g transform="translate(20, 60)">
      <rect width="280" height="90" rx="6" fill="#121A29" stroke="#263852" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="90" rx="2" fill="#10B981"/>
      <text x="16" y="26" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Monolith-to-Microservices Audit</text>
      <text x="16" y="48" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Strangler Fig migration strategies, domain boundary alignment, and zero-downtime cutover planning.</text>
    </g>

    <g transform="translate(20, 165)">
      <rect width="280" height="90" rx="6" fill="#121A29" stroke="#263852" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="90" rx="2" fill="#3B82F6"/>
      <text x="16" y="26" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Security &amp; Compliance Audit</text>
      <text x="16" y="48" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">SOC 2 Type II, ISO 27001, PCI-DSS compliance verification, and software supply-chain SLSA validation.</text>
    </g>

    <g transform="translate(20, 270)">
      <rect width="280" height="85" rx="6" fill="#121A29" stroke="#263852" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="85" rx="2" fill="#F59E0B"/>
      <text x="16" y="26" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Technical Debt Scoring</text>
      <text x="16" y="48" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Static code analysis, coupling index metrics, and maintenance cost forecasts.</text>
    </g>
  </g>

  <!-- Flow Arrows -->
  <path d="M 390 400 L 440 400" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="440,400 432,395 432,405" fill="#10B981"/>

  <!-- 2. Strategic Roadmap & Target Operating Model -->
  <g transform="translate(440, 210)">
    <rect width="400" height="380" rx="10" fill="#0A0E17" stroke="#1D2A3D" stroke-width="1.5"/>
    <text x="24" y="36" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">02 / TRANSFORMATION ROADMAP</text>
    
    <!-- Quarterly Strategy Timeline -->
    <g transform="translate(20, 60)">
      <rect width="360" height="70" rx="6" fill="#131B2A" stroke="#263852" stroke-width="1"/>
      <text x="16" y="24" fill="#10B981" font-family="monospace" font-size="11" font-weight="700">PHASE 1: FOUNDATION (MONTHS 1-3)</text>
      <text x="16" y="46" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Core cloud infrastructure baseline, CI/CD pipelines, and IAM zero-trust hardening.</text>
    </g>

    <g transform="translate(20, 140)">
      <rect width="360" height="70" rx="6" fill="#131B2A" stroke="#263852" stroke-width="1"/>
      <text x="16" y="24" fill="#3B82F6" font-family="monospace" font-size="11" font-weight="700">PHASE 2: CLOUD &amp; DATA MODERNIZATION (MONTHS 4-6)</text>
      <text x="16" y="46" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Event-driven backbone, database sharding, and real-time analytical lakehouses.</text>
    </g>

    <g transform="translate(20, 220)">
      <rect width="360" height="70" rx="6" fill="#131B2A" stroke="#263852" stroke-width="1"/>
      <text x="16" y="24" fill="#A855F7" font-family="monospace" font-size="11" font-weight="700">PHASE 3: AI &amp; SCALE GOVERNANCE (MONTHS 7-12)</text>
      <text x="16" y="46" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">MLOps integration, global multi-region replication, and automated disaster recovery.</text>
    </g>

    <!-- Governance Framework Box -->
    <g transform="translate(20, 300)">
      <rect width="360" height="55" rx="6" fill="#0C1420" stroke="#23344C" stroke-width="1"/>
      <text x="16" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Architecture Review Board (ARB) Governance</text>
      <text x="16" y="42" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Formal ADRs (Architecture Decision Records) &amp; quarterly tech radars.</text>
    </g>
  </g>

  <!-- Flow Arrows -->
  <path d="M 840 400 L 890 400" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="890,400 882,395 882,405" fill="#3B82F6"/>

  <!-- 3. FinOps & Executive ROI -->
  <g transform="translate(890, 210)">
    <rect width="240" height="380" rx="10" fill="#0A0E17" stroke="#1D2A3D" stroke-width="1.5"/>
    <text x="20" y="36" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">03 / VALUE &amp; FINOPS</text>
    
    <!-- Cost Reduction Card -->
    <g transform="translate(16, 60)">
      <rect width="208" height="90" rx="6" fill="#121A29" stroke="#263852" stroke-width="1"/>
      <text x="14" y="24" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Cloud FinOps Savings</text>
      <text x="14" y="56" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">-40%</text>
      <text x="14" y="74" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Rightsizing &amp; Spot Orchestration</text>
    </g>

    <!-- Speed to Market Card -->
    <g transform="translate(16, 160)">
      <rect width="208" height="90" rx="6" fill="#121A29" stroke="#263852" stroke-width="1"/>
      <text x="14" y="24" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Time to Market</text>
      <text x="14" y="56" fill="#3B82F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">-25%</text>
      <text x="14" y="74" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Streamlined Developer Velocity</text>
    </g>

    <!-- Fractional CTO Card -->
    <g transform="translate(16, 260)">
      <rect width="208" height="95" rx="6" fill="#121A29" stroke="#263852" stroke-width="1"/>
      <text x="14" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Fractional CTO Services</text>
      <text x="14" y="44" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Executive technical representation for board meetings, M&amp;A due diligence, and vendor negotiations.</text>
    </g>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(70, 615)">
    <text x="0" y="22" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">DELIVERY STANDARDS:</text>
    <text x="170" y="22" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">40% ROI</text>
    <text x="240" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Cost Optimization</text>
    <text x="400" y="22" fill="#3B82F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">100%</text>
    <text x="445" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Security Audit Preparedness</text>
    <text x="660" y="22" fill="#A855F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Zero Lock-In</text>
    <text x="750" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Open Standards Architecture</text>
  </g>
</svg>
